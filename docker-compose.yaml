services:
  solonet:
    container_name: solonet
    network_mode: host
    privileged: true

    ## Run solonet using performance mode
    ##
    ## WARNING: destructive action - this mode wipes and takes exclusive
    ## ownership of MONAD_TRIEDB_DEVICE_NAME
    ## Make sure to set the correct device for TrieDB

    # environment:
    #   SHOW_RPC_METHODS: "false"
    #   MONAD_SOLONET_CPU_LIMIT: "false"
    #   MONAD_TRIEDB_DEVICE_ENABLED: "true"
    #   MONAD_TRIEDB_DEVICE_AUTO_OVERRIDE: "true"
    #   MONAD_TRIEDB_DEVICE_NAME: "nvme0n1"
    #   MONAD_TXGEN_AUTO_START: "true"
    # # MONAD_TXGEN_PROFILE: "txgen-evm-stress.toml"
    # # MONAD_TXGEN_PROFILE: "txgen-light.toml"
    # # MONAD_TXGEN_PROFILE: "txgen-max-throughput.toml"
    # # MONAD_TXGEN_PROFILE: "txgen-mempool-stress.toml"
    # # MONAD_TXGEN_PROFILE: "txgen-standard.toml"
    # devices:
    #   - /dev/nvme0n1:/dev/nvme0n1

    ulimits:
      nofile:
        soft: 16384
        hard: 16384
      memlock:
        soft: "16770785280"
        hard: "16770785280"

    build:
      context: monad-solonet
      ## Build and run Solonet using Monad official APT package (default)

      # target: install-apt
      # args:
      #   MONAD_VERSION: 0.14.2

      ## Build and run Solonet using Monad remote source

      # target: install-remote
      # args:
      #   MONAD_BFT_REPO_URL: "https://github.com/category-labs/monad-bft.git"
      #   MONAD_BFT_REPO_TARGET: "v0.14.2" # branch (master), tag, commit hash (long-form)
      #   MONAD_EXECUTION_REPO_URL: "https://github.com/category-labs/monad.git"
      #   MONAD_EXECUTION_REPO_TARGET: "v0.14.2" # branch (master), tag, commit hash (long-form)

      ## Build and run Solonet using Monad local source

      # target: install-local
      # args:
      #   MONAD_LOCAL_SOURCE: source/monad-bft/
